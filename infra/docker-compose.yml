# Wholesale Scout on the Netcup server. Lives at ~/wholesale-scout on the server; Caddy fronts it.
#   cd ~/wholesale-scout && docker compose -f infra/docker-compose.yml up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: wholesale-scout:latest
    container_name: wholesale-scout
    restart: unless-stopped
    env_file: ../.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    ports:
      - "127.0.0.1:3010:3000"
    # Talk to Supabase through the host (Caddy / localhost), not container-to-container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
